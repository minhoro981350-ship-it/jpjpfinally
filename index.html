<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일본어 시험 마스터</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#f4f7f6;color:#333;margin:0;padding:10px}
h1{font-size:1.2rem;text-align:center;color:#2c3e50;margin:5px 0 12px}
.tab-nav{display:flex;gap:4px;margin-bottom:10px}
.tab-nav button{flex:1;padding:11px 2px;background:#4A90E2;color:#fff;font-weight:bold;font-size:.82rem;border:none;border-radius:6px;cursor:pointer;line-height:1.2}
.tab-nav button.active{background:#2C3E50}
.tab-content{display:none;background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tab-content.active{display:block}
.card{border:1px solid #e0e0e0;padding:10px;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.group-tag{background:#e1f5fe;color:#0288d1;padding:2px 5px;border-radius:4px;font-size:.75rem;font-weight:bold}
.group-tag.exc{background:#ffebee;color:#c62828}
.conj-row{font-size:.76rem;color:#555;margin-top:5px;background:#f8f9fa;padding:5px 6px;border-radius:4px;line-height:1.45}
.conj-row b{color:#2c3e50}
.star-btn{background:none;border:none;font-size:1.5rem;color:#ccc;cursor:pointer;padding:0 5px}
.star-btn.starred{color:#f1c40f}
.filter-box{background:#f8f9fa;padding:8px 10px;border-radius:6px;border:1px solid #ddd;margin-bottom:10px;font-size:.85rem;font-weight:bold;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
select.mode-select{padding:5px 8px;border-radius:5px;border:1px solid #ccc;font-size:.82rem;font-weight:bold;color:#2c3e50;background:#fff}
.mode-switch{display:flex;gap:5px;margin-bottom:8px;background:#eef2f5;padding:4px;border-radius:8px}
.mode-switch button{flex:1;padding:8px;border:none;border-radius:6px;font-weight:bold;font-size:.83rem;background:transparent;color:#555;cursor:pointer}
.mode-switch button.active{background:#fff;color:#2c3e50;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mode-switch.script-switch{background:#fce4ec}
.mode-switch.script-switch button.active{color:#d81b60}
.canvas-container{width:100%;display:flex;justify-content:center;margin:10px 0}
canvas{border:2px dashed #ff69b4;background:#fff;border-radius:8px;touch-action:none}
.btn{width:100%;padding:12px;border:none;border-radius:6px;background:#4A90E2;color:#fff;font-weight:bold;font-size:1rem;margin-top:8px;cursor:pointer}
.btn-sub{background:#7f8c8d}
.btn-ans{background:#27ae60}
.btn-next{background:#34495e;margin-top:14px}
.quiz-badge{display:inline-block;background:#2c3e50;color:#fff;font-size:.78rem;padding:3px 8px;border-radius:12px;margin-bottom:8px}
.quiz-prompt{font-size:1.18rem;font-weight:bold;margin-bottom:12px;color:#2c3e50;line-height:1.45;white-space:pre-line}
.hint-text{font-size:.82rem;color:#666;margin-bottom:8px}
.typing-input{width:100%;padding:12px;font-size:1.1rem;border:2px solid #4A90E2;border-radius:6px;text-align:center;font-weight:bold;outline:none}
.typing-input:focus{border-color:#2c3e50}
.feedback-box{margin-top:10px;padding:10px;border-radius:6px;font-weight:bold;text-align:center;font-size:.95rem;line-height:1.45;display:none}
.feedback-ok{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.feedback-no{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
</style>
</head>
<body>
<h1>📚 일본어 시험 단어장</h1>
<div class="tab-nav">
  <button id="btn-t1" class="active" onclick="goTab('t1')">📖 단어</button>
  <button id="btn-t2" onclick="goTab('t2')">🧠 개념연습</button>
  <button id="btn-t3" onclick="goTab('t3')">✍️ 활용퀴즈</button>
  <button id="btn-t4" onclick="goTab('t4')">📝 쓰기</button>
</div>
<div id="t1" class="tab-content active">
  <div class="filter-box">
    <span><input type="checkbox" id="starOnly" onchange="renderWordList()"> <label for="starOnly">⭐ 헷갈리는 단어만 보기</label></span>
    <span style="font-size:.8rem;color:#666">(총 <b id="wordCount">0</b>개)</span>
  </div>
  <div id="wordList"></div>
</div>
<div id="t2" class="tab-content">
  <div class="mode-switch">
    <button id="cMode-choice" class="active" onclick="setConceptMode('choice')">🔘 4지선다 고르기</button>
    <button id="cMode-type" onclick="setConceptMode('type')">⌨️ 직접 타자 입력</button>
  </div>
  <div class="filter-box">
    <span>연습 범위:</span>
    <select id="conceptFilter" class="mode-select" onchange="nextConcept()">
      <option value="all">전체 문법 규칙</option>
      <option value="te">て형 변환 규칙만</option>
      <option value="nai">ない형 변환 규칙만</option>
      <option value="masu">ます형 변환 규칙만</option>
      <option value="pot">가능형 변환 규칙만</option>
    </select>
  </div>
  <div id="conceptBadge" class="quiz-badge"></div>
  <div id="conceptQ" class="quiz-prompt"></div>
  <div id="conceptChoiceBox"></div>
  <div id="conceptTypeBox" style="display:none">
    <div class="hint-text">일본어 키보드로 정답 어미나 형태를 입력하세요 (예: って, られる)</div>
    <input type="text" id="conceptInput" class="typing-input" placeholder="여기에 입력..." onkeydown="if(event.key==='Enter')checkConceptTyping()">
    <button class="btn btn-ans" onclick="checkConceptTyping()">정답 확인</button>
  </div>
  <div id="conceptFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextConcept()">다음 개념 문제 ➔</button>
</div>
<div id="t3" class="tab-content">
  <div class="mode-switch script-switch">
    <button id="qScript-hira" class="active" onclick="setQuizScriptMode('hira')">🔤 히라가나 버전</button>
    <button id="qScript-kanji" onclick="setQuizScriptMode('kanji')">🈳 한자 버전</button>
  </div>
  <div class="mode-switch">
    <button id="qMode-choice" class="active" onclick="setQuizInputMode('choice')">🔘 4지선다 고르기</button>
    <button id="qMode-type" onclick="setQuizInputMode('type')">⌨️ 직접 타자 입력</button>
  </div>
  <div class="filter-box">
    <span><input type="checkbox" id="quizStarOnly" onchange="nextQuiz()"> <label for="quizStarOnly">⭐ 별표만</label></span>
    <select id="quizFormFilter" class="mode-select" onchange="nextQuiz()">
      <option value="all">🎲 전체 활용형 랜덤</option>
      <option value="te">て형 (테형) 집중</option>
      <option value="nai">ない형 (나이형) 집중</option>
      <option value="masu">ます형 (마스형) 집중</option>
      <option value="pot">가능형 (〜える/られる) 집중</option>
    </select>
  </div>
  <div id="quizBadge" class="quiz-badge"></div>
  <div id="quizQ" class="quiz-prompt"></div>
  <div id="quizOpts"></div>
  <div id="quizTypeBox" style="display:none">
    <div id="quizTypingHint" class="hint-text">히라가나로 활용형을 직접 입력하세요.</div>
    <input type="text" id="quizInput" class="typing-input" placeholder="활용형을 직접 입력하세요..." onkeydown="if(event.key==='Enter')checkQuizTyping()">
    <button class="btn btn-ans" onclick="checkQuizTyping()">정답 확인</button>
  </div>
  <div id="quizFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextQuiz()">다음 동사 문제 ➔</button>
</div>
<div id="t4" class="tab-content">
  <div class="filter-box">
    <span><input type="checkbox" id="dictStarOnly" onchange="nextDict()"> <label for="dictStarOnly">⭐ 헷갈리는 단어만 출제</label></span>
  </div>
  <div id="qMeaning" style="font-size:1.2rem;font-weight:bold;text-align:center;margin-bottom:5px"></div>
  <div class="canvas-container"><canvas id="paint" width="260" height="260"></canvas></div>
  <button class="btn btn-sub" onclick="clearBoard()">지우기</button>
  <button class="btn btn-ans" onclick="showAnswer()">정답 확인</button>
  <div id="ansText" style="display:none;text-align:center;font-size:1.05rem;font-weight:bold;margin-top:10px;color:#2c3e50;line-height:1.5"></div>
  <button class="btn btn-next" onclick="nextDict()">다음 문제 ➔</button>
</div>

const STORAGE_KEY = 'jp_quiz_v4_stars';
let words = defaultWords;
try {
  const savedStars = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  words = defaultWords.map(w => ({ ...w, starred: !!savedStars[w.id] }));
} catch(e) { words = defaultWords; }

function saveStars() {
  try {
    const map = {};
    words.forEach(w => { if (w.starred) map[w.id] = true; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
  } catch(e) {}
}

let curConcept = null, curQuiz = null, curQuizForm = 'te', quizScriptMode = 'hira', curDict = null;
let cv, ctx, drawing = false;

function goTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-nav button').forEach(e => e.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.getElementById('btn-' + tabId).classList.add('active');
}

function renderWordList() {
  const listEl = document.getElementById('wordList');
  const starOnly = document.getElementById('starOnly').checked;
  const filtered = starOnly ? words.filter(w => w.starred) : words;
  document.getElementById('wordCount').innerText = filtered.length;
  if (!filtered.length) {
    listEl.innerHTML = '<div style="text-align:center;color:#888;padding:20px">⭐ 마크 표시된 단어가 없습니다.</div>';
    return;
  }
  listEl.innerHTML = filtered.map(w => `
    <div class="card">
      <div style="flex:1">
        <div><b>${w.kanji}</b> (${w.hira}) <span class="group-tag ${w.group.includes('예외')?'exc':''}">${w.group}</span> - ${w.mean}</div>
        <div class="conj-row">ます: <b>${w.masu}</b> · て: <b>${w.te}</b> · ない: <b>${w.nai}</b> · 가능: <b>${w.pot}</b></div>
      </div>
      <button class="star-btn ${w.starred?'starred':''}" onclick="toggleStar(${w.id})">★</button>
    </div>
  `).join('');
}

function toggleStar(id) {
  const w = words.find(x => x.id === id);
  if (w) { w.starred = !w.starred; saveStars(); renderWordList(); }
}

function setConceptMode(m) {
  document.getElementById('cMode-choice').classList.toggle('active', m === 'choice');
  document.getElementById('cMode-type').classList.toggle('active', m === 'type');
  document.getElementById('conceptChoiceBox').style.display = m === 'choice' ? 'block' : 'none';
  document.getElementById('conceptTypeBox').style.display = m === 'type' ? 'block' : 'none';
  document.getElementById('conceptFeedback').style.display = 'none';
}

function nextConcept() {
  const f = document.getElementById('conceptFilter').value;
  const pool = f === 'all' ? conceptRules : conceptRules.filter(r => r.cat === f);
  curConcept = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('conceptBadge').innerText = curConcept.badge;
  document.getElementById('conceptQ').innerText = curConcept.q;
  document.getElementById('conceptFeedback').style.display = 'none';
  document.getElementById('conceptInput').value = '';
  const box = document.getElementById('conceptChoiceBox');
  box.innerHTML = '';
  [curConcept.ans, ...curConcept.fakes].sort(() => Math.random() - 0.5).forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn'; b.style.margin = '4px 0'; b.innerText = c;
    b.onclick = () => showConceptResult(c === curConcept.ans);
    box.appendChild(b);
  });
}

function checkConceptTyping() {
  const val = document.getElementById('conceptInput').value.trim().replace(/\s+/g, '');
  if (!val) return;
  const cleanAns = curConcept.ans.replace(/\(.*?\)/g, '').replace(/\s+/g, '');
  showConceptResult(val === curConcept.ans.replace(/\s+/g, '') || val === cleanAns);
}

function showConceptResult(isOk) {
  const fb = document.getElementById('conceptFeedback');
  fb.style.display = 'block';
  fb.className = 'feedback-box ' + (isOk ? 'feedback-ok' : 'feedback-no');
  fb.innerHTML = (isOk ? '⭕ 정답입니다!' : `❌ 오답! 정답: ${curConcept.ans}`) + `<br><span style="font-weight:normal;font-size:.85rem">${curConcept.desc}</span>`;
}

function makeSameFormFakes(w, formType, isHira) {
  const baseWord = isHira ? w.hira : w.kanji;
  const stem = baseWord.slice(0, -1);
  const realAns = isHira ? w[formType + 'H'] : w[formType];
  const fakes = new Set();

  if (formType === 'te') {
    fakes.add(stem + 'て'); fakes.add(stem + 'って'); fakes.add(stem + 'いて');
    fakes.add(stem + 'んで'); fakes.add(stem + 'いで'); fakes.add(stem + 'して');
  } else if (formType === 'nai') {
    fakes.add(stem + 'ない'); fakes.add(stem + 'あない'); fakes.add(stem + 'らない');
    fakes.add(stem + 'わない'); fakes.add(stem + 'いない'); fakes.add(baseWord + 'ない');
    if (w.hira === 'ある') { fakes.add('あらない'); fakes.add('あわない'); fakes.add('いない'); }
  } else if (formType === 'masu') {
    fakes.add(stem + 'ます'); fakes.add(stem + 'ります'); fakes.add(stem + 'います');
    fakes.add(stem + 'えます'); fakes.add(baseWord + 'ます');
  } else if (formType === 'pot') {
    fakes.add(stem + 'られる'); fakes.add(stem + 'れる'); fakes.add(stem + 'える');
    fakes.add(stem + 'りる'); fakes.add(stem + 'あれる');
    if (w.hira === 'くる') {
      fakes.add(isHira ? 'きられる' : '来れる');
      fakes.add(isHira ? 'これる' : '来える');
      fakes.add(isHira ? 'くられる' : '来える');
    } else if (w.hira === 'する') {
      fakes.add('しられる'); fakes.add('せられる'); fakes.add('すれる');
    }
  }

  fakes.delete(realAns);
  fakes.delete(w[formType]);
  fakes.delete(w[formType + 'H']);
  return Array.from(fakes).slice(0, 3);
}

function nextQuiz() {
  const starOnly = document.getElementById('quizStarOnly').checked;
  const f = document.getElementById('quizFormFilter').value;
  const pool = starOnly ? words.filter(w => w.starred) : words;

  if (!pool.length) {
    alert('⭐ 마크 표시한 단어가 없습니다!');
    document.getElementById('quizStarOnly').checked = false;
    nextQuiz(); return;
  }

  if (f === 'pot') {
    const potPool = pool.filter(w => w.pot !== '-');
    if (!potPool.length) {
      alert('선택하신 별표 단어 중 가능형 문제가 출제 가능한 단어가 없습니다.');
      document.getElementById('quizFormFilter').value = 'all';
      nextQuiz(); return;
    }
    curQuiz = potPool[Math.floor(Math.random() * potPool.length)];
    curQuizForm = 'pot';
  } else {
    curQuiz = pool[Math.floor(Math.random() * pool.length)];
    const availableForms = curQuiz.pot === '-' ? ['te', 'nai', 'masu'] : ['te', 'nai', 'masu', 'pot'];
    curQuizForm = f === 'all' ? availableForms[Math.floor(Math.random() * availableForms.length)] : f;
  }

  renderCurrentQuiz();
}

  document.getElementById('quizInput').value = '';

  const target = isHira ? curQuiz[curQuizForm + 'H'] : curQuiz[curQuizForm];
  const fakes = makeSameFormFakes(curQuiz, curQuizForm, isHira);

  [target, ...fakes].sort(() => Math.random() - 0.5).forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn'; b.style.margin =
